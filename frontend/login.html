<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Raiya Recruiter Login</title>
  <link rel="stylesheet" href="/styles.css" />
  <style>
    body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #f5f7fa, #dbe7ff); min-height: 100vh; display: grid; place-items: center; margin: 0; }
    .login-shell { width: min(960px, 92vw); background: white; border-radius: 24px; box-shadow: 0 20px 60px rgba(15, 40, 80, 0.18); display: grid; grid-template-columns: 1.1fr 0.9fr; overflow: hidden; }
    .hero { padding: 48px; background: linear-gradient(160deg, #0d2748, #1f5ea8); color: white; }
    .hero h1 { margin: 0 0 16px; font-size: 2.2rem; }
    .hero p { line-height: 1.6; opacity: 0.92; }
    .panel { padding: 40px; display: grid; gap: 16px; }
    form, .sso-block { display: grid; gap: 12px; }
    input, button { padding: 12px 14px; border-radius: 12px; border: 1px solid #c9d4e6; font-size: 1rem; }
    button { border: none; background: #1f5ea8; color: white; cursor: pointer; }
    button.secondary { background: #eef3fb; color: #18385d; }
    .error { color: #b11f3a; min-height: 1.4em; }
    @media (max-width: 720px) { .login-shell { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="login-shell">
    <section class="hero">
      <h1>Resume Screening SaaS</h1>
      <p>Use platform-admin credentials for break-glass access, or start tenant SSO with your company email.</p>
    </section>
    <section class="panel">
      <h2>Platform Admin Login</h2>
      <form id="login-form">
        <input type="email" id="email" placeholder="admin@company.com" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
      </form>
      <div class="error" id="login-error"></div>
      <hr />
      <div class="sso-block">
        <h3>Tenant SSO</h3>
        <input type="email" id="sso-email" placeholder="you@tenant.com" />
        <button class="secondary" id="sso-button" type="button">Continue With SSO</button>
      </div>
      <div class="error" id="sso-error"></div>
    </section>
  </div>
  <script>
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const ssoError = document.getElementById('sso-error');

    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginError.textContent = '';
      const response = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        loginError.textContent = payload.detail || 'Login failed.';
        return;
      }
      window.location.href = '/recruiter-platform.html';
    });

    document.getElementById('sso-button').addEventListener('click', async () => {
      ssoError.textContent = '';
      const email = document.getElementById('sso-email').value.trim();
      if (!email) {
        ssoError.textContent = 'Enter your tenant email address.';
        return;
      }
      const response = await fetch('/api/auth/sso/start', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ email, redirect_path: '/recruiter-platform.html' }),
      });
      const payload = await response.json().catch(() => ({}));
      if (!response.ok) {
        ssoError.textContent = payload.detail || 'SSO startup failed.';
        return;
      }
      window.location.href = payload.authorization_url;
    });
  </script>
</body>
</html>
